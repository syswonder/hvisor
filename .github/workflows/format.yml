name: Format

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Prettier
        run: npm install -g prettier@3.10.1

      - name: YAML format
        run: prettier --check "**/*.{yml,yaml}" --tab-width 2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-11-01
          components: rustfmt

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust non-src format
        run: |
          git ls-files -z -- '*.rs' ':!src/**' \
            | xargs -0 rustfmt --check --edition 2021

      - name: Install C formatter
        run: |
          python3 -m pip install --user clang-format==23.1.5
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: C format
        run: |
          clang-format --version
          git ls-files -z -- '*.c' '*.h' \
            | xargs -0 clang-format --dry-run --Werror

      - name: JSON format
        run: prettier --check "**/*.json" --tab-width 4

      - name: Install Taplo
        run: npm install -g @taplo/cli@0.7.0

      - name: TOML format
        run: taplo fmt --check

      - name: Install Ruff
        run: |
          pip install --user ruff==0.17.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Python format
        run: ruff format --check .
