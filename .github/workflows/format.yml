name: Format

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Prettier
        run: npm install -g prettier@3.10.1

      - name: YAML format
        run: prettier --check "**/*.{yml,yaml}" --tab-width 2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-11-01
          components: rustfmt

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust non-src format
        run: |
          git ls-files -z -- '*.rs' ':!src/**' \
            | xargs -0 rustfmt --check --edition 2021
