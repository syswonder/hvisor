name: CI
on:
  # push:
  #   branches:
  #     - main
  #     - dev
  # pull_request:
  #   branches:
  #     - main
  #     - dev
  workflow_dispatch:
env:
  MODE: debug
jobs:
  license-checker:
    name: license-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: License Check
        run: |
          set -x
          ./tools/license_checker.sh
