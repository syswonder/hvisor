bids:
  - bid: riscv64/qemu-plic
    build_args:
      - KDIR=/home/light/DEMO/linux/linux-6.10
    tests:
      mode: qemu
      cases:
        - zone0_start
        - zone1_start

  - bid: aarch64/qemu-gicv3
    build_args:
      - KDIR=/home/light/DEMO/linux/linux-5.4
    tests:
      mode: qemu
      uboot_cmd: bootm 0x40400000 - 0x40000000
      uboot_ready_pattern: =>
      cases:
        - zone0_start
        - zone1_start

  - bid: aarch64/rk3568
    build_args:
      - KDIR=/home/light/DEMO/sdk/rk356x-up4-2c/kernel
    tests:
      mode: board
      serial: /dev/serial/by-id/usb-1a86_USB2.0-Ser_-if00-port0
      power_serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
      baudrate: 1500000
      uboot_ready_pattern: '=>'
      uboot_cmd: pci enum;setenv serverip 192.168.1.181; setenv ipaddr 192.168.1.240; setenv loadaddr 0x60800000; setenv fdt_addr 0xa0000000; setenv zone0_kernel_addr 0x00280000; tftp ${loadaddr} ${serverip}:hvisor.bin; tftp ${fdt_addr} ${serverip}:rk3568_limit_zone0.dtb; tftp ${zone0_kernel_addr} ${serverip}:Image; bootm ${loadaddr} - ${fdt_addr};
      network:
        host_ip: 192.168.1.181
        host_user: light
        staging_dir: /home/light/tftp/ci_deploy
        zone1_dtb: platform/aarch64/rk3568/image/dts/rk3568_limit_zone1.dtb
      lspci:
        expected_bdfs:
          - "0001:10:00.0"
          - "0001:11:00.0"
          - "0002:20:00.0"
          - "0002:21:00.0"
        min_count: 4
      cases:
        - zone0_start
        - network
        - lspci
        - zone1_start


  - bid: x86_64/qemu
    build_args:
      - KDIR=/home/light/DEMO/linux/linux-5.19
    tests:
      mode: qemu
      cases:
        - zone0_start
        - zone1_start


