set timeout=1   # waiting time before automatic booting
set default=0   # default menu entry index

insmod all_video

menuentry "Hvisor" {
    multiboot2 /boot/hvisor # use multiboot spec to boot
    module2 /boot/kernel/boot.bin 0
    module2 /boot/kernel/boot.bin 5008000
    module2 /boot/kernel/setup.bin 500a000
    module2 /boot/kernel/vmlinux.bin 5100000
    module2 /boot/kernel/initramfs.cpio.gz 1a000000
    boot
}

# Boot Asterinas as the root zone (built with the aster_guest feature). The whole
# bzImage is loaded so its setup header lands at 0x50ff000 (gpa 0xff000) and the
# protected-mode kernel at 0x5100000 (gpa 0x100000); the initramfs follows at gpa
# 0x15300000. GRUB transparently inflates the gzipped initramfs on load.
menuentry "Asterinas" {
    multiboot2 /boot/hvisor
    module2 /boot/kernel/boot.bin 0
    module2 /boot/kernel/boot.bin 5008000
    module2 /boot/kernel/aster-kernel-osdk-bin 50ff000
    module2 /boot/kernel/initramfs.cpio.gz 1a300000
    boot
}

if [ ${grub_platform} == "efi" ]; then
    menuentry "UEFI Setting" {
        fwsetup
    }
fi

menuentry "System Reboot" --class=reboot {
    reboot
}

menuentry "System Shutdown" --class=halt {
    halt
}