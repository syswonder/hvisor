set timeout=10  # waiting time before automatic booting
set default=0   # default menu entry index (0 = Linux; set to 1 for an
                # unattended Asterinas root-zone boot when hvisor was built
                # with FEATURES="... asterinas_root")

insmod all_video

menuentry "Hvisor" {
    multiboot2 /boot/hvisor # use multiboot spec to boot
    module2 /boot/kernel/boot.bin 0
    module2 /boot/kernel/boot.bin 5008000
    module2 /boot/kernel/setup.bin 500a000
    module2 /boot/kernel/vmlinux.bin 5100000
    boot
}

# Requires an hvisor built with FEATURES="... asterinas_root". The trailing
# number on each module2 line is the *host-physical* address hvisor relocates
# the module to (module_init parses it); the guest-physical addresses are that
# minus the zone base 0x500_0000 (so 0x500a000->setup GPA 0xa000,
# 0x5100000->kernel GPA 0x100000, 0x1a30_0000->initrd GPA 0x1530_0000). The
# initramfs must be the *uncompressed* newc cpio (Asterinas consumes it raw).
menuentry "Hvisor (Asterinas root zone)" {
    multiboot2 /boot/hvisor # use multiboot spec to boot
    module2 /boot/kernel/boot.bin 0
    module2 /boot/kernel/boot.bin 5008000
    module2 /boot/kernel/asterinas-setup.bin 500a000
    module2 /boot/kernel/asterinas-vmlinux.bin 5100000
    module2 /boot/kernel/initramfs.cpio 1a300000
    boot
}

if [ ${grub_platform} == "efi" ]; then
    menuentry "UEFI Setting" {
        fwsetup
    }
fi

menuentry "System Reboot" --class=reboot {
    reboot
}

menuentry "System Shutdown" --class=halt {
    halt
}